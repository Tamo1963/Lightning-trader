# Hard limits, enforced in code (G5), never by Jev. [TUNE] values are frozen before the final test.
capital_inr: 1000000
risk_per_trade_hard_cap_pct: 2.0      # absolute ceiling = INR 20,000 at current capital
risk_ladder_pct:                      # working risk per trade by stage; advance only on stage exit criteria
  shadow_paper: 1.0                   # simulated, sized as if live at 1%
  pilot_1: 0.5                        # first 100 live trades
  pilot_2: 1.0                        # after pilot_1 criteria pass
  full: 2.0                           # only after pilot_2 criteria pass; never exceeds hard cap
max_premium_outlay_pct: 10.0          # capital committed to one position's premium
daily_loss_limit_pct: 3.0             # must be >= 1.5x working risk so one stop does not end the day
weekly_loss_limit_pct: 6.0
drawdown_halt_pct: 10.0               # from peak equity; halts all entries until manual review
max_open_positions: 2
max_entries_per_day: 3
max_consecutive_losses_halt: 5        # [TUNE] pause entries, require manual review
min_reward_risk: 2.0                  # on option premium, after costs
entry_window: {start: "09:30", end: "14:30"}
square_off_time: "15:15"
horizon_minutes: 30                   # [TUNE]
time_stop_minutes: 30
max_spread_pct_of_premium: 3.0        # [TUNE]
min_open_interest: null
min_volume: null
data_max_age_seconds: 5
reconcile_interval_seconds: 15
block_expiry_day_entries: true
instruments:                          # [VERIFY] refresh from the Dhan instrument master daily
  NIFTY:     {lot_size: 65}
  BANKNIFTY: {lot_size: 30}
jev:
  model: "jev-1.13.0"                 # pinned; re-validate before moving to 1.14.x
  timeout_seconds: 5
  max_retries: 1
  on_error: reject                    # fail closed
  min_repeat_agreement: 0.95
  rotations: 3                        # per choice question, averaged in code
stocks:                               # separate study; disabled for live until its own gate passes
  enabled_for_shadow: false           # switch on after Nifty Phase 4 passes
  universe_source: "nifty50_constituents_fno_liquid"
  max_premium_outlay_pct: 5.0
  max_positions_per_stock: 1
  max_stock_positions: 2
  block_if_earnings_within_days: 2    # [TUNE]
  block_if_fno_ban: true
  lot_size: "from_instrument_master"
