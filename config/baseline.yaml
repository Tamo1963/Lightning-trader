# Variant A (baseline) strategy parameters. [TUNE] items are fixed on validation data, then frozen.
instrument: NIFTY
underlying_security_id: 13   # Nifty 50 index (Dhan scrip master, IDX_I)
strike_step: 50
# Lot size in force by date. 65 confirmed in the Dhan scrip master (Oct 2026); earlier rows [VERIFY].
lot_schedule:
  - {from: 2000-01-01, lot: 75}   # [VERIFY] pre-2021 Nifty lot
  - {from: 2021-07-01, lot: 50}   # [VERIFY] exact change date
  - {from: 2024-11-20, lot: 75}
  - {from: 2025-12-31, lot: 65}
# Weekly expiry weekday by date (0=Mon). Tuesday confirmed in the scrip master; Thursday era [VERIFY].
# A holiday moves expiry to the previous trading day (taken from the data).
expiry_schedule:
  - {from: 2019-01-01, weekday: 3}
  - {from: 2025-09-01, weekday: 1}
min_dte_days: 2           # [TUNE] skip contracts expiring sooner (gamma/theta)
iv: 0.14                  # ModelPricer only (fallback/tests). Real backtests use Dhan expired-options prices.
indicators:
  rsi_period: 14
  supertrend_period: 10
  supertrend_mult: 3.0
  vwma_period: 20
  adx_period: 14
  atr_period: 14
signal:
  monthly_rsi_threshold: 50
  entry_mode: edge        # edge | pullback
  htf_filter: full        # full | no_monthly | none
  adx_min: 0              # 0 = off, so baseline A is exactly the stated rule set
  post_roll_block_bars: 8
barriers:
  stop_pct: 0.30          # [TUNE] premium stop as fraction of entry
  net_reward_risk: 2.0    # target solved so reward/risk >= this AFTER costs and slippage
  max_target_pct: 1.0     # reject if target needs more than +100% premium
  horizon_bars: 2         # 2 x 15 min = 30 min time stop; a large value (e.g. 99) = hold to square-off
  min_premium: 20
execution:
  slippage_pct: 0.01      # [TUNE] per side, fraction of premium
  tick: 0.05
data:
  rolling_slots: {0: 1, 1: 2}   # our slot (0 near, 1 next) -> Dhan expiryCode [VERIFY on first fetch]
  strike_offsets: 3             # fetch ATM-3 .. ATM+3 for each side
  volume_proxy: options         # spot index has no volume; VWAP/VWMA weight by ATM+/-k option volume
# Chronological split (spec section 7). The test period stays SEALED until all parameters are frozen.
splits:
  train:      {from: 2021-11-01, to: 2024-06-30}
  validation: {from: 2024-07-01, to: 2025-09-30}
  test:       {from: 2025-10-01, to: 2026-12-31}
